name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      # Engine, scene, the copies of shared code in the mod, and end-to-end tests that start the server.
      - run: bun test ./server ./shared
