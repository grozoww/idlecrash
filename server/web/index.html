<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IdleCrash</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #12141b; --panel: #1b1f2c; --panel-2: #232839; --line: #2d3550;
    --ink: #eceff8; --dim: #8a93ab; --green: #5fe0a0; --red: #ff6f61; --amber: #ffc857; --blue: #6cb8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: .14em; }
  .pill { padding: 3px 10px; border-radius: 99px; background: var(--panel-2); color: var(--dim); font-size: 13px; }
  .pill.on { color: var(--green); } .pill.warn { color: var(--amber); }
  .grow { flex: 1; }
  .balance { font-size: 16px; } .balance small { color: var(--dim); }
  .up { color: var(--green); } .down { color: var(--red); }

  #stage { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 8px; }
  canvas { display: block; margin: 0 auto; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #overlay { position: absolute; left: 22px; top: 18px; pointer-events: none; text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 12px rgba(0,0,0,.35); }
  #big { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: .02em; }
  #sub { margin-top: 4px; font-size: 14px; color: #fff; }
  #watch { position: absolute; right: 18px; top: 18px; max-width: 58%; padding: 6px 10px; font-size: 13px; color: var(--amber);
           background: rgba(14, 16, 24, .8); border: 1px solid var(--line); border-radius: 4px; pointer-events: none; }
  #watch[hidden] { display: none; }
  #lock { position: absolute; inset: 8px; display: grid; place-content: center; text-align: center; padding: 16px;
          background: rgba(14, 16, 24, .72); border-radius: 4px; font-size: 16px; }
  #lock[hidden] { display: none; }
  #lock b { display: block; font-size: 20px; margin-bottom: 6px; }

  #controls { display: grid; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button { font: inherit; color: var(--ink); background: var(--panel-2); border: 2px solid var(--line); border-radius: 6px;
           padding: 8px 14px; cursor: pointer; transition: none; }
  button:hover:not(:disabled) { border-color: var(--blue); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: #2d6a4f; border-color: #3f9b73; font-weight: 700; padding: 12px 22px; font-size: 17px; min-width: 190px; }
  button.cash { background: #8a5a12; border-color: #d99a2b; }
  button.on { border-color: var(--amber); color: var(--amber); }
  kbd { font: inherit; font-size: 12px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
  .label { color: var(--dim); }

  .cols { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 640px) { .cols { grid-template-columns: 3fr 2fr; } }
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .panel h2 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 0; } td.n { text-align: right; padding-right: 14px; }
  tr.me td:first-child { font-weight: 700; }
  .won { color: var(--green); } .lost { color: var(--red); } .dim { color: var(--dim); }
  #history { display: flex; flex-wrap: wrap; gap: 6px; }
  #history span { padding: 1px 7px; border-radius: 4px; background: var(--panel-2); font-size: 13px; }
  #note { min-height: 1.5em; color: var(--amber); }
  footer { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>IDLECRASH</h1>
    <span id="pill" class="pill">connecting…</span>
    <span class="grow"></span>
    <span class="balance">balance <b id="balance">–</b> <small id="delta"></small></span>
  </header>

  <section id="stage">
    <canvas id="scene" width="64" height="32"></canvas>
    <div id="overlay"><div id="big"></div><div id="sub"></div></div>
    <div id="watch" hidden></div>
    <div id="lock" hidden></div>
  </section>

  <section id="controls">
    <div class="row">
      <button id="bet" class="primary" disabled>Bet<kbd>b</kbd></button>
      <button id="cash" class="primary cash" disabled>Cash out<kbd>c</kbd></button>
    </div>
    <div class="row">
      <span class="label">stake</span>
      <span id="stakes" class="row"></span>
      <button id="auto">auto-out off<kbd>x</kbd></button>
      <button id="rebet">rebet off<kbd>r</kbd></button>
    </div>
    <div id="note" aria-live="polite"></div>
  </section>

  <section class="cols">
    <div class="panel"><h2 id="tableTitle">table</h2><table id="players"></table></div>
    <div class="panel"><h2>last crashes</h2><div id="history"></div></div>
  </section>

  <footer>Fake tokens only. Nothing here is worth anything. Bets are open only while Claude is working.</footer>
</main>
<script src="/game.js"></script>
</body>
</html>
